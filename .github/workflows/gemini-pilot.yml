name: Gemini feasibility pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-feasibility-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[api,dev]"
      - name: Validate existing Version 2 design
        run: make v2-validate
      - name: Run non-confirmatory Gemini pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: bash scripts/run_gemini_pilot.sh
      - name: Preserve pilot attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-pilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            outputs/gemini_pilot/
            docs/claude_confirmatory_preregistration_lock.json
